[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  256dpi/MQTT@2.5.3
  bblanchon/ArduinoJson@6.21.5
build_flags = -std=gnu++11

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps = bblanchon/ArduinoJson@6.21.5
build_src_filter = +<controller.cpp> +<control_step.cpp> +<sensor_reading.cpp> +<pid_config.cpp> +<device_settings.cpp> +<provisioning_protocol.cpp> +<mqtt_protocol.cpp>
build_flags = -std=c++11
